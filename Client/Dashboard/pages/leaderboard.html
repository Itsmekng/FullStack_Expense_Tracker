<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="/Client/External_cdn/css/index.css">
</head>
<body>
  <!-- Navbar Start -->
  <nav class="navbar bg-success fixed-top">
    <div class="container-fluid">
      <div class="text-white fw-medium fs-4 pe-3">Expense Tracker</div>
      <button class="btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
          <img height="35px" src="/Client//public/icons/menu.png" alt="">
      </button>
      <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Dashboard</h5>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
          <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
            <li class="nav-item">
              <a class="nav-link active fs-4" aria-current="page" href="#">Leaderboard</a>
            </li>
            <li class="nav-item">
              <a class="nav-link fs-4" aria-current="page" onclick="localStorage.removeItem('token')" href="/Client/Authenticate/signIn.html">Log Out</a>
            </li>
            <li class="nav-item">
              <a class="nav-link fs-4 " aria-current="page" href="/Client/index.html">All Expense</a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </nav>
  <div class="container">
    <table class="table container" id="example" style="margin-top: 75px;">
      <thead>
        <tr>
          <th class="bg-success text-white" scope="col">Name</th>
          <th class="bg-success text-white" scope="col">Total Expense</th>
        </tr>
      </thead>
      <tbody class="tableBody">
      </tbody>
    </table>
  </div>
</body>
<script type="module" src="./index.js"></script>
<script src="/Client/External_cdn/js/index.js"></script>
</html>
