<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../External_cdn/css/bootstrap_v5.3.8.css">
</head>
<body>
    <nav class="navbar bg-success py-2">
        <div class="container-fluid text-white fw-medium fs-4">
            Expense tracker
        </div>
    </nav>
    <form class="container mt-4" onsubmit="handleSubmitFormForSignUp(event)">
        <div class="fs-3 fw-medium my-4">Create New Account</div>
        <div class="mb-3">
            <label for="Full_Name" class="form-label">Full Name</label>
            <input type="text" required class="form-control" id="Full_Name">
        </div>
        <div class="mb-3">
            <label for="Email" class="form-label">Email</label>
            <input type="email" required class="form-control" id="Email">
        </div>
        <div class="mb-3">
            <label for="Password" class="form-label">Password</label>
            <input type="password" minlength="6" required class="form-control" id="Password">
        </div>
        <div class="mb-3">
            <a class="text-decoration-none" href="./signIn.html">Already have an account login here</a>
        </div>
        <button type="submit" class="btn btn-success">Sign up</button>
    </form>
</body>
<script src="index.js"></script>
<script src="/Client/constant/constant.js" ></script>
<script src="../External_cdn/js/axios_v1.20.0.js"></script>
</html>
