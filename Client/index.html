<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense tracker app</title>
    <link rel="stylesheet" href="/Client/External_cdn/css/index.css">
</head>
<body>
    <nav class="navbar bg-success py-2">
        <div class="container-fluid text-white fw-medium fs-4 pe-3">
            Expense tracker
            <a id="goToDashboard" href="./Dashboard/pages/leaderboard.html">
                <img height="35px" src="./public/icons/performance.png" alt="">
            </a>
        </div>
    </nav>
    <form class="container mt-4" onsubmit="handleSubmitForm(event)">
        <div class="fs-3 fw-medium my-4">Your all expense in one place</div>
        <div class="mb-3">
            <label for="ExpenseAmount" class="form-label">Expense Amount</label>
            <input type="number" required class="form-control" id="ExpenseAmount">
        </div>
        <div class="mb-3">
            <label for="ExpenseDesc" class="form-label">Expense Desciption</label>
            <input type="text" required class="form-control" id="ExpenseDesc">
        </div>
        <div class="mb-3">
            <label for="ExpenseNotes" class="form-label">Expense Notes</label>
            <input type="text" required class="form-control" id="ExpenseNotes">
        </div>
        <label for="ExpenseCategory" class="form-label">Expense Category</label>
        <div class="input-group mb-3">
            <select class="form-select" id="ExpenseCategory">
                <option selected>Select category</option>
                <option value="Movie">Movie</option>
                <option value="Game">Game</option>
                <option value="Book">Book</option>
            </select>
            <button onclick="AskAI()" type="button" class="input-group-text btn btn-outline-danger" id="basic-addon2">Ask AI</button>
        </div>
        <button type="submit" class="btn btn-success">Submit</button>
        <button type="button" id="goPremium" class="btn btn-outline-info" data-bs-toggle="modal" data-bs-target="#staticBackdrop">
        Go Premium
        </button>
    </form>

    <div class="input-group container mt-4 mb-4">
        <input type="date" id="from" class="form-control">
        <input type="date" id="to" class="form-control">
        <button id="dateFilter" onclick="dateFilter()" class="btn btn-outline-primary">Apply</button>
    </div>

    <div class="container">
        <table id="example" class="display mt-4 table table-striped" style="width:100%">
            <thead>
                <tr>
                    <th class="bg-success text-white">createdAt</th>
                    <th class="bg-success text-white">Category</th>
                    <th class="bg-success text-white">Description</th>
                    <th class="bg-success text-white">Amount</th>
                    <th class="bg-success text-white">Notes</th>
                    <th class="bg-success text-white">Action</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="staticBackdropLabel">You are one step ahead from premium plan</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form onsubmit="goPremium(event)">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="customerNumber" class="form-label">Customer Number</label>
                        <input type="number" required class="form-control" id="customerNumber">
                    </div>
                    <div class="mb-3">
                        <label for="Amount" class="form-label">Amount</label>
                        <input type="text" disabled value="30.00 INR" class="form-control" id="Amount">
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="exampleCheck1">
                        <label class="form-check-label" for="exampleCheck1">Check me out</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Tap to Pay</button>
                </div>
            </form>
            </div>
        </div>
    </div>
</body>
<script src="index.js" ></script>
<script  src="/Client/External_cdn/js/index.js"></script>
</html>
