<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense tracker app</title>
    <link rel="stylesheet" href="./External_cdn//boostrap.css">
</head>
<body>
    <nav class="navbar bg-success py-2">
        <div class="container-fluid text-white fw-medium fs-4">
            Expense tracker
        </div>
    </nav>
    <form class="container mt-4" onsubmit="handleSubmitForm(event)">
        <div class="fs-3 fw-medium my-4">Your all expense in one place</div>
        <div class="mb-3">
            <label for="ExpenseAmount" class="form-label">Expense Amount</label>
            <input type="number" required class="form-control" id="ExpenseAmount">
        </div>
        <div class="mb-3">
            <label for="ExpenseDesc" class="form-label">Expense Desciption</label>
            <input type="text" required class="form-control" id="ExpenseDesc">
        </div>
        <div class="mb-3">
            <label for="ExpenseCategory" class="form-label">Expense Category</label>
            <select class="form-select" id="ExpenseCategory">
                <option selected>Select category</option>
                <option value="Movie">Movie</option>
                <option value="Game">Game</option>
                <option value="Book">Book</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Submit</button>
    </form>
    <ul class="list-group container mt-4 row-gap-3">
    </ul>
</body>
<script src="index.js" ></script>
<script src="./External_cdn//axios.js"></script>
</html>
